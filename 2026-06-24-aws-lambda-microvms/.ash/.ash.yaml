global_settings:
  suppressions:
    - rule_id: 'B102'
      path: '**/app.py'
      reason: 'Reviewed: exec() of model-generated code is the entire purpose of this demo. It runs INSIDE a per-session Firecracker microVM (VM-level isolation) — that isolation is the security boundary being demonstrated, not a flaw.'
    - rule_id: 'B104'
      path: '**/app.py'
      reason: 'Reviewed: binding to 0.0.0.0 is required inside the ephemeral microVM — ingress is gated by the platform proxy + a short-lived X-aws-proxy-auth token, so the server is never publicly reachable on its own.'
    - rule_id: 'python.flask.security.audit.app-run-param-config.avoid_app_run_with_bad_host'
      path: '**/app.py'
      reason: 'Reviewed: same as B104 — the Flask app binds 0.0.0.0 only inside the isolated microVM; the platform proxy + auth token are the access control.'
    - rule_id: 'B310'
      path: '**/demo.py'
      reason: 'Reviewed: urllib.request.urlopen is called only with a hardcoded https:// scheme against the microVM endpoint. No user-controlled or file:/custom scheme is possible.'
    - rule_id: 'CKV_DOCKER_2'
      path: '**/Dockerfile'
      reason: 'Reviewed: liveness/readiness is provided by the microVM platform lifecycle hooks (/ready, /healthz on :9000), not a Docker HEALTHCHECK. A HEALTHCHECK instruction is not used by the microVM build path.'
    - rule_id: 'CKV_DOCKER_3'
      path: '**/Dockerfile'
      reason: 'Reviewed: this is a minimal demo image; the Firecracker microVM provides the isolation boundary. Sample is illustrative — readers should add a non-root USER for production hardening (noted in the README).'
