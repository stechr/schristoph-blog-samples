[project]
name = "factchecker"
version = "0.1.0"
description = "Stateless claim-verification backend (Claude on Bedrock + AgentCore Web Search)"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40.0",
    "botocore>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factchecker"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
