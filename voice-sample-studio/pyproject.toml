[project]
name = "voice-sample-studio"
version = "0.3.0"
description = "Local studio to record, score, and manage voice reference clips for Qwen3-TTS voice cloning."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Stefan Christoph", email = "stechristoph@gmail.com" }]
# Runtime deps. All licenses are permissive:
#   numpy BSD-3 · soundfile BSD-3 · pyloudnorm MIT · gradio Apache-2.0 · librosa ISC
dependencies = [
    "numpy>=1.24",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
    "gradio>=4.0",
    "librosa>=0.10",      # ISC — pitch tracking (pyin) for intonation / monotone detection
]

[project.optional-dependencies]
# Local perceptual MOS — DEFAULT v2 backend is TorchAudio-SQUIM (objective, PESQ→MOS).
#   torch BSD-3 · torchaudio BSD-2 · SQUIM_OBJECTIVE weights CC-BY-4.0 (all permissive).
mos = ["torch>=2.1", "torchaudio>=2.1"]
# (legacy MOS hooks, optional): ONNX DNSMOS
mos-onnx = ["onnxruntime>=1.16"]
# Local transcription for ref_text auto-fill, WER, and word timestamps (WPM/pauses).
transcribe = ["faster-whisper>=1.0"]   # MIT
# Cloud-assisted features (graceful-degrade if absent): RICH advice via Bedrock
# Claude (Converse) + VOICE PREVIEW via the Qwen3-TTS async endpoint.
cloud = ["boto3>=1.34"]                 # Apache-2.0
dev = ["pytest>=7"]

[project.scripts]
voice-studio = "voice_studio.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voice_studio"]
